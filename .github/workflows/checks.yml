name: Tests and Bandit
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Verify preserved evidence manifests
        run: python -c "from pathlib import Path; from tools.evidence import verify; paths=list(Path('evidence').rglob('SHA256.json')); assert paths; [verify(p.parent) for p in paths]; print(f'{len(paths)} manifests verified')"
      - run: python -m pip install bandit==1.9.4
      - run: bandit -r tools
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test console ownership guards without operating a VM
        shell: pwsh
        run: ./tests/test_Repair-ConsoleBootstrap.ps1
